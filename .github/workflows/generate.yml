name: generate

# Keeps this SDK in lockstep with the backend API.
#
# Source: the backend's integration branch `dev-release`. Features land there
# before any release tag, so the SDK follows dev-release, not `v*` tags (BAR-2638).
#
# Trigger paths:
# 1. repository_dispatch api-spec-updated with client_payload.sha. Sent by the
#    backend's sdk-notify workflow after a green dev-release merge, once that
#    backend change is merged (BAR-2638). Until then this path does not fire.
# 2. Hourly cron on the dev-release head. This is the path that works today,
#    and the fallback once trigger 1 is live.
# 3. Manual workflow_dispatch, optional `sha` input (default: dev-release head).
#
# Behavior: fetch web/backend/docs/swagger.json at that commit, compare its
# sha256 with spec/source-state.json, and if it moved regenerate the client and
# open a pull request from chore/regenerate. Merging that PR tags the next patch
# release (release.yml).
#
# Requires the repository secret BMC_BACKEND_SPEC_TOKEN: a fine-grained personal
# access token with "Contents: read" on bare-metal-cloud/backend. Without it the
# job skips (it cannot read the private backend repo).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "backend commit to generate from (default: dev-release head)"
        required: false
        default: ""
  repository_dispatch:
    types: [api-spec-updated]
  schedule:
    - cron: "23 * * * *" # hourly fallback; a dev-release merge is picked up within the hour

permissions:
  contents: write
  pull-requests: write

jobs:
  watch-dev-release:
    runs-on: namespace-profile-bmc
    steps:
      - uses: actions/checkout@v4

      - name: Pick the backend commit and check for spec changes
        id: watch
        env:
          GH_TOKEN: ${{ secrets.BMC_BACKEND_SPEC_TOKEN }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BMC_BACKEND_SPEC_TOKEN not set; cannot read bare-metal-cloud/backend. Set the secret to enable regeneration."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="${PAYLOAD_SHA:-${INPUT_SHA:-}}"
          if [ -z "$sha" ]; then
            sha="$(gh api repos/bare-metal-cloud/backend/git/ref/heads/dev-release --jq .object.sha)"
          fi
          # Only a full commit SHA may reach the API path below.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit sha: '$sha'"
            exit 1
          fi

          # Raw media type: the JSON contents API returns an empty "content" for
          # files over 1 MB, and swagger.json is about 1.9 MB.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/bare-metal-cloud/backend/contents/web/backend/docs/swagger.json?ref=$sha" \
            > /tmp/spec-raw.json
          spec_sha="$(sha256sum /tmp/spec-raw.json | awk '{print $1}')"
          state_sha="$(jq -r .raw_spec_sha256 spec/source-state.json)"

          echo "backend commit: $sha (last generated: $(jq -r .source_sha spec/source-state.json))"
          if [ "$spec_sha" = "$state_sha" ]; then
            echo "spec unchanged since last regeneration"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp /tmp/spec-raw.json spec/swagger.json
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Hash of the raw download, recorded as-is: generate.sh normalises
          # spec/swagger.json in place, so re-hashing it later would not match.
          echo "spec_sha=$spec_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.watch.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Regenerate client
        if: steps.watch.outputs.changed == 'true'
        run: scripts/generate.sh

      - name: Build, vet and test
        if: steps.watch.outputs.changed == 'true'
        run: |
          go build ./... && go vet ./... && go test ./...

      - name: Record the new source state
        if: steps.watch.outputs.changed == 'true'
        env:
          SHA: ${{ steps.watch.outputs.sha }}
          RAW_SHA: ${{ steps.watch.outputs.spec_sha }}
        run: |
          jq -n --arg sha "$SHA" --arg raw "$RAW_SHA" \
            '{source_repo: "bare-metal-cloud/backend", source_ref: "dev-release", source_sha: $sha, spec_path: "web/backend/docs/swagger.json", raw_spec_sha256: $raw}' \
            > spec/source-state.json

      - name: Open regeneration PR
        if: steps.watch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/regenerate
          title: "chore: regenerate client from API spec"
          body: |
            Automated regeneration from the backend OpenAPI spec
            (`bare-metal-cloud/backend` → `web/backend/docs/swagger.json` at
            dev-release commit `${{ steps.watch.outputs.sha }}`).

            Review the diff as the API delta. Merging tags the next patch
            release automatically.
          commit-message: "chore: regenerate client from API spec"
          delete-branch: true
