          description: Request Timeout
      summary: Preview error page (408)
      tags:
      - test-error-preview
  /api/test/error/409:
    get:
      description: Triggers a 409 Conflict error so the themed error page can be verified
        locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError409
      responses:
        "409":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Conflict
      summary: Preview error page (409)
      tags:
      - test-error-preview
  /api/test/error/413:
