            Polymorphic association for connection
            connection_type examples: managed_ssh_connections, aws_key_pair, gcp_service_account
          type: string
        cpu_cores:
          description: Resource information (optional)
          type: integer
        created_at:
          type: string
        created_by_user_id:
          type: integer
        deletion_reason_code:
          description: |-
            DeletionReasonCode is the machine-contract reason a VM removal landed in
            cleanup_incomplete (issue #1454, AC3): one of the VMRemovalReason*
            constants. NULL on every row not in cleanup_incomplete. The FE maps
            codes → copy; unknown codes render status_reason (sanitized human
            fallback detail), so the exact strings are a wire contract.
          type: string
        description:
          type: string
        disk_size:
          description: In GB
          type: integer
        id:
          type: integer
        k3s_state:
          description: |-
            K3SState is the guest-truth k3s lifecycle state of this VM's host
            (story 124-1 AC6, epic-124): 'none' = no k3s installed on the guest;
            'installed' = a successful SetupNode/uninstall-symmetric moment completed;
            'unknown' = never observed (the default — rows predating the column and
            guests outside cluster flows backfill nothing). Writers land ONLY at the
            guest-state moments that exist today, both via WriteNodePhase (the
            ADR-060 single-writer choke point): phase ready → installed,
            phase removed → none. The 124.3 probe writer and the detach /
            delete-keep writers arrive with their owning stories.
          type: string
        kernel_version:
          type: string
        last_seen_at:
          type: string
        metrics_last_collected_at:
          description: Last successful metrics collection
          type: string
        metrics_retention_hours:
          description: "Metrics collection (Story 20-12: On-Demand Metrics)"
          type: integer
        name:
          description: VM identification
          type: string
        network:
          $ref: '#/components/schemas/models.Network'
        network_id:
          description: Network association (optional - VM can be part of a network)
          type: integer
        operating_system:
          description: System information (auto-detected after connection)
          type: string
        org_id:
          description: "Tenant scope (ADR-062): replaces the former owner-only UserID."
          type: integer
        origin:
          $ref: '#/components/schemas/models.ResourceOrigin'
        os_version:
          type: string
        private_ip:
          type: string
        project_id:
          type: integer
        provider:
          description: Provider information
          type: string
        provider_vm_id:
          description: "Provider-specific VM identifier (e.g., EC2 instance ID, GCP\
            \ instance name, Azure VM name)"
          type: string
        public_ip:
          type: string
        ram_size:
          description: In MB
          type: integer
        region:
          type: string
        role:
          description: "\"bastion\", \"worker\", \"\" (standalone)"
          type: string
        specs_status:
          description: |-
            SpecsStatus is the EVIDENCE status of the CPU/RAM/disk spec columns
            (story 124-2, D4): 'reported' = an agent metrics report carrying
            cpu_count/memory_total_bytes/disk_total_bytes has been seen for this VM;
            'unknown' = never observed (the default — no report, no inference). The
            only writer after creation is the D4 projection in the metrics collector
            (services.SpecProjector): create-time declared specs and the SSH display
            migration are not evidence — specs_status stays 'unknown' for them. The
            status is NEVER derived from the column values (never "0 means
            unknown"). Consumers: cluster-create preflight (124.3) and the VM
            pages' specs pill.
          type: string
        ssh_key_encrypted_data_id:
          description: |-
            Encrypted SSH Key Storage (Polymorphic encrypted_data table)
            References the EncryptedData table where the SSH private key is stored encrypted
          type: integer
        ssh_public_key:
          description: SSH Access (for VMs where we provisioned SSH keys)
          type: string
        ssh_username:
          description: "SSH username (default: ubuntu)"
          type: string
        status:
          description: Status
          type: string
        status_reason:
          type: string
        stopped_at:
          description: "Story 18-vm-07: Graceful shutdown timestamp"
          type: string
        tags:
          description: Tags (JSON field)
          type: string
        tier:
          $ref: '#/components/schemas/models.ResourceTier'
        updated_at:
          type: string
      type: object
