              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Request Entity Too Large
      summary: Preview error page (413)
      tags:
      - test-error-preview
  /api/test/error/422:
    get:
      description: Triggers a 422 Unprocessable Entity error so the themed error page
        can be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError422
      responses:
        "422":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Unprocessable Entity
      summary: Preview error page (422)
      tags:
      - test-error-preview
  /api/test/error/429:
    get:
      description: Triggers a 429 Too Many Requests error so the themed error page
        can be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError429
      responses:
        "429":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Too Many Requests
      summary: Preview error page (429)
      tags:
      - test-error-preview
  /api/test/error/500:
    get:
      description: Triggers a 500 Internal Server Error so the themed error page can
        be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError500
      responses:
        "500":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Internal Server Error
      summary: Preview error page (500)
      tags:
      - test-error-preview
  /api/test/error/502:
    get:
      description: Triggers a 502 Bad Gateway error so the themed error page can be
        verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError502
      responses:
        "502":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Bad Gateway
      summary: Preview error page (502)
      tags:
      - test-error-preview
  /api/test/error/503:
    get:
      description: Triggers a 503 Service Unavailable error so the themed error page
        can be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError503
      responses:
        "503":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Service Unavailable
      summary: Preview error page (503)
      tags:
