openapi: 3.0.1
info:
  contact:
    email: support@baremetalcloud.com
    name: API Support
  description: "API for managing bare metal cloud infrastructure. Tenant resource\
    \ list/index GETs use TenantListScope: send X-Org-ID plus X-Project-Id (numeric\
    \ project id, or the sentinel `all` for every accessible project in that org).\
    \ Inventory: docs/agents/tenant-list-inventory.md."
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Bare Metal Cloud API
  version: "1.0"
servers:
- url: //localhost:3001/api/v1
paths:
  /agent-service/health:
    get:
      description: "Returns health status, connected agents count, and Redis connectivity"
      operationId: GetAgent-serviceHealth
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/agent.HealthResponse'
          description: OK
      summary: Agent service health check
      tags:
      - agent-service
  /agent/enrollment/status:
    get:
      description: Returns the cached JWT + agent_id for a registration token that
        has already been exchanged (idempotent replay).
      operationId: GetAgentEnrollmentStatus
      parameters:
      - description: Registration token
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "410":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Gone
      summary: Recover enrollment identity for a consumed token
      tags:
      - agent-service
  /agent/exchange-token:
    post:
      description: Exchanges a short registration token for a JWT used for agent authentication
      operationId: PostAgentExchange-token
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: Exchange request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      summary: Exchange registration token for JWT
      tags:
      - agent-service
      x-codegen-request-body-name: request
  /agent/install.sh:
    get:
      description: Returns a dynamically generated bash script for installing the
        BMC agent. Token is validated but NOT consumed — agent consumes it during
        registration.
      operationId: GetAgentInstall.sh
      parameters:
      - description: Agent registration token (short token)
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: Bash installation script
        "401":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "500":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get agent installation script
      tags:
      - agent
  /agent/install/commands:
    post:
      description: "Returns install command with 12-character short token. Response\
        \ format varies by cluster_type (kubernetes returns manifest_url, bare-metal\
        \ returns curl/bash command)."
      operationId: PostAgentInstallCommands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.InstallCommandPostRequest'
        description: Install command request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.UnifiedInstallCommandResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      summary: Get unified install command
      tags:
      - agent-installation
      x-codegen-request-body-name: request
  /agent/manifests:
    get:
      description: Get a personalized Kubernetes manifest for deploying the agent.
        Validates short registration tokens (tokens are NOT consumed here - agent
        consumes them during registration).
      operationId: GetAgentManifests
      parameters:
      - description: Agent registration token (short token)
        in: query
        name: token
        required: true
        schema:
          type: string
      - description: Cluster name
        in: query
        name: name
        schema:
          type: string
      - description: "Namespace (default: bare-metal-agent)"
        in: query
        name: namespace
        schema:
          type: string
      - description: "Agent image tag (default: latest)"
        in: query
        name: imageTag
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: YAML manifest
        "401":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "403":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Forbidden
        "500":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get agent installation manifest
      tags:
      - agent
  /agent/registration-token:
    post:
      description: "Generates a short, human-friendly registration token for agent\
        \ installation. Requires authentication."
      operationId: PostAgentRegistration-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.GenerateRegistrationTokenRequest'
        description: Token generation request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.GenerateRegistrationTokenResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
      summary: Generate GitHub-style registration token
      tags:
      - registration-tokens
      x-codegen-request-body-name: request
  /agent/shutdown:
    post:
      description: Receives graceful shutdown notification from agents before they
        disconnect
      operationId: PostAgentShutdown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.ShutdownNotificationRequest'
        description: Shutdown notification
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
      summary: Receive agent shutdown notification
      tags:
      - agent-service
      x-codegen-request-body-name: request
  /agent/tokens/validate:
    post:
      description: Validates a JWT token and returns the associated claims
      operationId: PostAgentTokensValidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.ValidateTokenRequest'
        description: Token validation request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ValidateTokenResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.ErrorResponse'
          description: Bad Request
      summary: Validate token
      tags:
      - agent-tokens
      x-codegen-request-body-name: request
  /agents/{cluster_id}/health:
    get:
      description: Returns health status by querying the agent through AgentQuerier
      operationId: GetAgentsCluster_idHealth
      parameters:
      - description: Cluster ID
        in: path
        name: cluster_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent unreachable or agent error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent not connected
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Query timeout
      summary: Get agent health
      tags:
      - agents
  /agents/{cluster_id}/info:
    get:
      description: Returns static node information by querying the agent through AgentQuerier
      operationId: GetAgentsCluster_idInfo
      parameters:
      - description: Cluster ID
        in: path
        name: cluster_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent unreachable or agent error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent not connected
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Query timeout
      summary: Get agent node info
      tags:
      - agents
  /agents/{cluster_id}/query:
    get:
      description: Queries a custom endpoint on the agent through the agent tunnel
      operationId: GetAgentsCluster_idQuery
      parameters:
      - description: Cluster ID
        in: path
        name: cluster_id
        required: true
        schema:
          type: string
      - description: "Endpoint path (e.g., /query/custom)"
        in: query
        name: endpoint
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Custom endpoints not supported
      summary: Query custom agent endpoint
      tags:
      - agents
  /agents/{cluster_id}/stats:
    get:
      description: Returns real-time node statistics by querying the agent through
        AgentQuerier
      operationId: GetAgentsCluster_idStats
      parameters:
      - description: Cluster ID
        in: path
        name: cluster_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Invalid request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent unreachable or agent error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Agent not connected
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Query timeout
      summary: Get agent node stats
      tags:
      - agents
  /api/clusters/validate-name/{name}:
    get:
      description: Validate cluster name for DNS-1123 compliance and uniqueness
      operationId: GetApiClustersValidate-nameName
      parameters:
      - description: Cluster name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/handlers.ValidateClusterNameResponse'
          description: OK
        "401":
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: Unauthorized
      summary: Validate cluster name
      tags:
      - clusters
  /api/test/error/400:
    get:
      description: Triggers a 400 Bad Request error so the themed error page can be
        verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError400
      responses:
        "400":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Bad Request
      summary: Preview error page (400)
      tags:
      - test-error-preview
  /api/test/error/401:
    get:
      description: Triggers a 401 Unauthorized error so the themed error page can
        be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError401
      responses:
        "401":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Unauthorized
      summary: Preview error page (401)
      tags:
      - test-error-preview
  /api/test/error/403:
    get:
      description: Triggers a 403 Forbidden error so the themed error page can be
        verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError403
      responses:
        "403":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Forbidden
      summary: Preview error page (403)
      tags:
      - test-error-preview
  /api/test/error/404:
    get:
      description: Triggers a 404 Not Found error so the themed error page can be
        verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError404
      responses:
        "404":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Not Found
      summary: Preview error page (404)
      tags:
      - test-error-preview
  /api/test/error/405:
    get:
      description: Triggers a 405 Method Not Allowed error so the themed error page
        can be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError405
      responses:
        "405":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Method Not Allowed
      summary: Preview error page (405)
      tags:
      - test-error-preview
  /api/test/error/408:
    get:
      description: Triggers a 408 Request Timeout error so the themed error page can
        be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError408
      responses:
