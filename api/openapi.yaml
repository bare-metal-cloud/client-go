  /api/test/error/504:
    get:
      description: Triggers a 504 Gateway Timeout error so the themed error page can
        be verified locally. Only available when ENABLE_TEST_ROUTES=true.
      operationId: GetApiTestError504
      responses:
        "504":
          content:
            text/html:
              schema:
                type: object
            application/json:
              schema:
                type: object
          description: Gateway Timeout
      summary: Preview error page (504)
      tags:
      - test-error-preview
  /api/v1/admin/users/{id}/mfa/disable:
    post:
      description: Force-disable MFA for a user. Requires admin role. No TOTP code
        needed.
      operationId: PostApiV1AdminUsersIdMfaDisable
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.MFADisableResponse'
          description: MFA disabled
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Invalid user ID
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: MFA not enabled for user
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal server error
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: MFA service unavailable
      summary: Admin force-disable user MFA
      tags:
      - admin
  /api/v1/admin/vault/rotation-health:
    get:
      description: "Returns current SMK state, blob version counts, and last rotation\
        \ timestamp. Requires admin role."
      operationId: GetApiV1AdminVaultRotation-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.VaultRotationHealthResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: SMK not initialized
      summary: SMK rotation health check
      tags:
      - admin-vault
  /api/v1/admin/vault/rotation-status:
    get:
      description: "Returns recent rotation events, current key state, and whether\
        \ blobs need rewrap. Requires admin role."
      operationId: GetApiV1AdminVaultRotation-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.VaultRotationAdminStatusResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: SMK not initialized
      summary: SMK rotation status
      tags:
      - admin-vault
  /api/v1/auth/login/mfa:
    post:
      description: "Validate challenge token and TOTP code, create full session with\
        \ mfa_verified=true"
      operationId: PostApiV1AuthLoginMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.MFALoginRequest'
        description: MFA token and TOTP code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.MFALoginResponse'
          description: MFA verified; full session issued
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Invalid request (missing/malformed code)
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Invalid or expired challenge/code
        "429":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Too many failed attempts
        "503":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: MFA service unavailable
      summary: "MFA-Enforced Login Flow: complete MFA login"
      tags:
      - auth
      x-codegen-request-body-name: request
  /api/v1/auth/mfa/recover:
    post:
      description: Authenticate using a backup code instead of TOTP when device is
        lost. Creates a full session on success. Consumes the backup code (single-use).
        Auto-disables MFA when all codes consumed.
      operationId: PostApiV1AuthMfaRecover
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.MFARecoverRequest'
        description: MFA challenge token and backup code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.MFARecoverResponse'
          description: Backup code accepted; session created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Invalid request (missing/empty code)
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Invalid or expired challenge token / backup code
        "429":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Too many failed attempts
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal server error
        "503":
          content:
            application/json:
              schema:
